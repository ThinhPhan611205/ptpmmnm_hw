<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập thông tin</title>
</head>
<body>
    <form action="config.php" method="post" name="input_in4">
        <label>Enter your infomation</label> 
        <table>
            <tr>
                <td>Họ và tên:</td>
                <td><input type="text" name="name"></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><input type="text" name="address"></td>
            </tr>
            <tr>
                <td>Phone:</td>
                <td><input type="text" name="phone"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="male">Nam
                    <input type="radio" name="gender" value="female">Nữ
                </td>
            </tr>
            <tr>
                <td>Country:</td>
                <td>
                    <select name="country">
                        <option value="vietnam">Việt Nam</option>
                        <option value="laos">Laos</option>
                        <option value="cambodia">Cambodia</option>
                        <option value="armerica">Armerica</option>
                        <option value="china">China</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Study:</td>
                <td>
                    <input type="checkbox" name="study[]" value="php">PHP & MySQL
                    <input type="checkbox" name="study[]" value="java">ASP.NET
                    <input type="checkbox" name="study[]" value="python">CCNA
                    <input type="checkbox" name="study[]" value="python">Security+
                </td>
            </tr>
            <tr>
                <td>Note</td>
                <td>
                    <textarea name="note" >

                    </textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Submit" name="submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
